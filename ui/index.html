<!doctype html>
<!-- Start page served by run-sc-main_multi.sh at http://<pi or laptop>:8080/ — add it to the tablet's home screen. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-Store UI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 24px; background: #111; color: #eee;
         font: 18px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a.load { display: block; padding: 28px 56px; border-radius: 16px; background: #2e7d32; color: #fff;
           font-size: 28px; font-weight: 600; text-decoration: none; }
  a.load:active { background: #1b5e20; }
  .version { font-family: ui-monospace, monospace; color: #9e9e9e; }
  .msg { color: #ffcc80; max-width: 40em; }
</style>
</head>
<body>
  <a class="load" id="load" href="main.tosc" download="main.tosc">Load layout into TouchOSC</a>
  <div class="version" id="version">layout version: …</div>
  <div class="msg" id="msg"></div>
<script>
  // Android browsers often fail at plain-http downloads, because their download service fetches the file
  // again outside the page. So the page fetches the layout itself and saves it from memory (blob);
  // the plain link is only the fallback for browsers without fetch.
  const msg = document.getElementById("msg");
  document.getElementById("load").addEventListener("click", async (ev) => {
    ev.preventDefault();
    msg.textContent = "loading …";
    try {
      const r = await fetch("main.tosc", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = new Blob([await r.arrayBuffer()], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "main.tosc";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      msg.textContent = "layout loaded (" + blob.size + " bytes) and handed to the browser: "
        + "open it from the download notification with TouchOSC";
    } catch (e) {
      msg.textContent = "download failed: " + e.message;
    }
  });

  // The version this machine's code expects, read from the manifest next to the layout
  fetch("ui_manifest.scd", { cache: "no-store" })
    .then(r => r.text())
    .then(t => {
      const hash = (t.match(/hash:\s*"([0-9a-f]+)"/) || [])[1] || "?";
      const build = (t.match(/build:\s*"([^"]*)"/) || [])[1] || "";
      document.getElementById("version").textContent = "layout version: " + hash + (build ? " (" + build + ")" : "");
    })
    .catch(() => { document.getElementById("version").textContent = "layout version: unknown"; });
</script>
</body>
</html>
